version: '3'
services:
  poast-relay:
    build: .
    container_name: poast-relay
    restart: always
    environment:
      - INBOUND_PATH_UUID=${INBOUND_PATH_UUID}
      - INBOUND_AUTH_TOKEN=${INBOUND_AUTH_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GATEWAY_URL=${GATEWAY_URL}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN}
      - TARGET_SESSION_KEY=${TARGET_SESSION_KEY}
      - GHOST_MODE=${GHOST_MODE:-false}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-100}
      - GROQ_TIMEOUT_SECONDS=${GROQ_TIMEOUT_SECONDS:-60}
      - GATEWAY_TIMEOUT_SECONDS=${GATEWAY_TIMEOUT_SECONDS:-10}
      - GATEWAY_RETRY_ATTEMPTS=${GATEWAY_RETRY_ATTEMPTS:-3}
      # OAuth Relay (Docker mode)
      - OAUTH_ENABLED=${OAUTH_ENABLED:-false}
      - OAUTH_USE_TCP=${OAUTH_USE_TCP:-true}
      - OAUTH_TCP_BIND_ADDRESS=${OAUTH_TCP_BIND_ADDRESS:-0.0.0.0}
      - OAUTH_TCP_HOST=${OAUTH_TCP_HOST:-127.0.0.1}
      - OAUTH_TCP_FALLBACK_PORT=${OAUTH_TCP_FALLBACK_PORT:-9999}
      - OAUTH_CALLBACK_PATH=${OAUTH_CALLBACK_PATH:-/oauth/callback}
      - OAUTH_DEFAULT_TIMEOUT=${OAUTH_DEFAULT_TIMEOUT:-300.0}
      # Token Usage Dashboard
      - OPENCLAW_BASE_DIR=/openclaw
      # #2666: python requests/httpx would otherwise use the image's certifi bundle (compromised roots);
      # point them at the host store mounted above (not a file bind: Coolify would copy the file into its DB and write it back on deploy)
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    volumes:
      - /home/rich/git/openclaw:/openclaw:ro
      # #2666 (eMudhra CA incident): trust the host's clean CA store, read-only, not the image's
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /usr/share/ca-certificates:/usr/share/ca-certificates:ro
    ports:
      - "9999:9999"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.poast-relay.rule=Host(`poast.richardkemp.uk`)"
      - "traefik.http.routers.poast-relay.entrypoints=http"
      - "traefik.http.routers.poast-relay.middlewares=crowdsec-bouncer@file"
      - "traefik.http.services.poast-relay.loadbalancer.server.port=8000"
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  traefik:
    external:
      name: traefik
